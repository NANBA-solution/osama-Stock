<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="theme-color" content="#f5f5f7" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="apple-mobile-web-app-title" content="在庫フォーム" />
  <title>王様のスプーン｜在庫フォーム</title>
  <link rel="stylesheet" href="styles.css?v=20250617" />
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>在庫ストック</h1>
      <p class="subtitle">王様のスプーン</p>
      <label class="date-row">
        <span>日付</span>
        <input type="date" id="reportDate" />
      </label>
    </header>

    <main id="formRoot"></main>

    <nav class="quick-links" aria-label="よく使うリンク">
      <h2 class="quick-links-heading">クイックリンク</h2>

      <section class="quick-links-block">
        <h3 class="quick-links-label">発注</h3>
        <ul class="quick-menu">
          <li>
            <a
              class="quick-item quick-item--order"
              href="https://store.xorder.jp/login/line?lm=invited&amp;shop_order_supplier_id=1621530&amp;h=e404a7b2002933bd58d70b4867480c35737f89ccef53db43f99df9eb56dd666c&amp;t=1777350308.278031"
              target="_blank"
              rel="noopener noreferrer"
            >
              <span class="quick-icon" aria-hidden="true">🥩</span>
              <span class="quick-body">
                <span class="quick-title">肉発注</span>
                <span class="quick-desc">xorder</span>
              </span>
              <span class="quick-arrow" aria-hidden="true">›</span>
            </a>
          </li>
          <li>
            <a class="quick-item quick-item--tel" href="tel:0663536607">
              <span class="quick-icon" aria-hidden="true">🥬</span>
              <span class="quick-body">
                <span class="quick-title">野菜発注</span>
                <span class="quick-desc">06-6353-6607</span>
              </span>
              <span class="quick-arrow" aria-hidden="true">›</span>
            </a>
          </li>
        </ul>
      </section>

      <section class="quick-links-block">
        <h3 class="quick-links-label">連絡</h3>
        <ul class="quick-menu">
          <li>
            <a class="quick-item quick-item--tel" href="tel:0798454400">
              <span class="quick-icon" aria-hidden="true">🛢</span>
              <span class="quick-body">
                <span class="quick-title">油回収</span>
                <span class="quick-desc">0798-45-4400</span>
              </span>
              <span class="quick-arrow" aria-hidden="true">›</span>
            </a>
          </li>
        </ul>
      </section>

      <section class="quick-links-block">
        <h3 class="quick-links-label">勤怠・資料</h3>
        <ul class="quick-menu">
          <li>
            <a class="quick-item quick-item--timee" href="timee-qr.png" target="_blank" rel="noopener">
              <span class="quick-icon" aria-hidden="true">⏱</span>
              <span class="quick-body">
                <span class="quick-title">タイミーQR</span>
                <span class="quick-desc">チェックイン／アウト</span>
              </span>
              <span class="quick-arrow" aria-hidden="true">›</span>
            </a>
          </li>
          <li>
            <a
              class="quick-item quick-item--timecard"
              href="https://connect.airregi.jp/login?client_id=AID&amp;redirect_uri=https%3A%2F%2Fconnect.airregi.jp%2Fview%2Fmypage%2Ftop%3Fclient_id%3DAID"
              target="_blank"
              rel="noopener noreferrer"
            >
              <span class="quick-icon" aria-hidden="true">🕐</span>
              <span class="quick-body">
                <span class="quick-title">タイムカード</span>
                <span class="quick-desc">Airレジ</span>
              </span>
              <span class="quick-arrow" aria-hidden="true">›</span>
            </a>
          </li>
          <li>
            <a class="quick-item quick-item--doc" href="staff-manual.pdf" target="_blank" rel="noopener">
              <span class="quick-icon" aria-hidden="true">📖</span>
              <span class="quick-body">
                <span class="quick-title">仕込みマニュアル</span>
                <span class="quick-desc">PDF</span>
              </span>
              <span class="quick-arrow" aria-hidden="true">›</span>
            </a>
          </li>
        </ul>
      </section>
    </nav>

    <footer class="footer">
      <div class="btn-row">
        <button type="button" id="previewBtn" class="btn btn-secondary">プレビュー</button>
        <button type="button" id="copyBtn" class="btn btn-primary">📋 コピー</button>
        <button type="button" id="lineShareBtn" class="btn btn-line">LINE共有</button>
      </div>
      <p id="toast" class="toast" hidden>コピーしました！</p>
    </footer>
  </div>

  <dialog id="previewDialog" class="preview-dialog">
    <div class="preview-inner">
      <h2>共有プレビュー</h2>
      <div id="previewText" class="preview-content"></div>
      <div class="preview-actions">
        <button type="button" id="copyFromPreview" class="btn btn-primary">コピー</button>
        <button type="button" id="lineShareFromPreview" class="btn btn-line">LINE共有</button>
        <button type="button" id="closePreview" class="btn btn-secondary">閉じる</button>
      </div>
    </div>
  </dialog>

  <script src="app.js?v=20250617"></script>
</body>
</html>
